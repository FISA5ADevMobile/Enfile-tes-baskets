on:
  push:
    branches:
      - develop
      - feature/cicd-build-apk

name: Build APK App

jobs:
  build:
    name: Build and Release new apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create .env file
        run: |
          echo "APP_NAME=${{ secrets.APP_NAME }}" > frontend/mobile/enfiletesbasket/.env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> frontend/mobile/enfiletesbasket/.env
      - uses: actions/setup-java@v2
        with:
          distribution: "zulu"
          java-version: "11"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
      - run: flutter --version
        working-directory: frontend/mobile/enfiletesbasket
      - run: flutter pub get
        working-directory: frontend/mobile/enfiletesbasket
      - run: flutter build apk --release --split-per-abi
        working-directory: frontend/mobile/enfiletesbasket

      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "frontend/mobile/enfiletesbasket/build/app/outputs/apk/release/*"
          tag: v0.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}
