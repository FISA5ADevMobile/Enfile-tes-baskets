name: 🚀 Deploy API to Heroku (Preprod & Prod)

on:
  push:
    branches:
      - deploy_back  # Déploiement sur Préproduction
      - develop      # Déploiement en Production

env:
  DOCKER_CONTEXT: backend/api/enfiletesbaskets
  DOCKERFILE: Dockerfile

jobs:
  build:
    name: 🛠️ Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Debug GitHub Workspace
        run: |
          echo "🔍 GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "🔍 Current Directory: $(pwd)"
          echo "🔍 List contents of root:"
          ls -al
          echo "🔍 List contents of backend/api/enfiletesbaskets:"
          ls -al backend/api/enfiletesbaskets || echo "❌ Directory not found"


      - name: 🐳 Build Docker Image
        run: |
          echo "🔧 Running Docker Build Command:"
          echo "docker build -t enfiletesbaskets-api -f $GITHUB_WORKSPACE/backend/api/enfiletesbaskets/Dockerfile $GITHUB_WORKSPACE/backend/api/enfiletesbaskets"
          docker build -t enfiletesbaskets-api -f $GITHUB_WORKSPACE/backend/api/enfiletesbaskets/Dockerfile $GITHUB_WORKSPACE/backend/api/enfiletesbaskets




      - name: 🛡️ Save Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enfiletesbaskets-api
          path: ${{ env.DOCKER_CONTEXT }}

  deploy-preprod:
    name: 🚀 Deploy to Heroku (Preproduction)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deploy_back'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔑 Authenticate with Heroku
        run: |
          echo "::add-mask::${{ secrets.HEROKU_PREPROD_API_KEY }}"
          echo "${{ secrets.HEROKU_PREPROD_API_KEY }}" | docker login --username=_ --password-stdin registry.heroku.com

      - name: 🚀 Push Docker Image to Heroku (Preprod)
        run: |
          docker tag enfiletesbaskets-api registry.heroku.com/${{ secrets.HEROKU_APP_NAME_PREPROD }}/web
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME_PREPROD }}/web

      - name: 🚀 Release to Heroku (Preprod)
        run: |
          heroku container:release web --app ${{ secrets.HEROKU_APP_NAME_PREPROD }}
          heroku config:set ENVIRONMENT=docker --app ${{ secrets.HEROKU_APP_NAME_PREPROD }}

  deploy-prod:
    name: 🚀 Deploy to Heroku (Production)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔑 Authenticate with Heroku
        run: |
          echo "::add-mask::${{ secrets.HEROKU_API_KEY }}"
          echo "${{ secrets.HEROKU_API_KEY }}" | docker login --username=_ --password-stdin registry.heroku.com

      - name: 🚀 Push Docker Image to Heroku (Prod)
        run: |
          docker tag enfiletesbaskets-api registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web

      - name: 🚀 Release to Heroku (Prod)
        run: |
          heroku container:release web --app ${{ secrets.HEROKU_APP_NAME }}
          heroku config:set ENVIRONMENT=docker --app ${{ secrets.HEROKU_APP_NAME }}
