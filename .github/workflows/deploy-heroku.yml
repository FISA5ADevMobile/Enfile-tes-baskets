name: 🚀 CI/CD Pipeline to Heroku

on:
  push:
    branches:
      - deploy_back  # Déploiement de test
      - develop      # Déploiement officiel en Production

env:
  HEROKU_APP_NAME: enfiletesbaskets-api
  DOCKER_IMAGE_NAME: enfiletesbaskets-api

jobs:
  docker-build:
    name: 🛠️ Build Docker Image
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:20.10.7
        options: --privileged

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Enable Docker BuildKit
        run: |
          export DOCKER_BUILDKIT=1

      - name: 🐳 Build Docker Image
        run: |
          echo "🔧 Building Docker Image for branch ${{ github.ref_name }}"
          docker build -t ${{ env.DOCKER_IMAGE_NAME }} -f ./backend/api/enfiletesbaskets/Dockerfile ./backend/api/enfiletesbaskets

      - name: 🐳 Tag Docker Image
        run: |
          if [ "${{ github.ref_name }}" == "refs/heads/deploy_back" ]; then
            docker tag ${{ env.DOCKER_IMAGE_NAME }} registry.heroku.com/${{ env.HEROKU_APP_NAME }}/web
          elif [ "${{ github.ref_name }}" == "refs/heads/develop" ]; then
            docker tag ${{ env.DOCKER_IMAGE_NAME }} registry.heroku.com/${{ env.HEROKU_APP_NAME }}/web
          fi

      - name: 🐳 Save Docker Image as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /var/lib/docker/volumes

  heroku-deploy:
    name: 🚀 Deploy to Heroku
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔑 Install dpl and Authenticate with Heroku
        run: |
          gem install dpl
          echo "::add-mask::${{ secrets.HEROKU_API_KEY }}"
          echo "${{ secrets.HEROKU_API_KEY }}" | docker login --username=_ --password-stdin registry.heroku.com

      - name: 🚀 Push Docker Image to Heroku
        run: |
          docker push registry.heroku.com/${{ env.HEROKU_APP_NAME }}/web

      - name: 🚀 Release on Heroku
        run: |
          heroku container:release web --app ${{ env.HEROKU_APP_NAME }}
          heroku config:set ENVIRONMENT=${{ github.ref_name == 'develop' && 'prod' || 'test' }} --app ${{ env.HEROKU_APP_NAME }}
